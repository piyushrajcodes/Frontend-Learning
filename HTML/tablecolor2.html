<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    table,tr,th,td{
        border: 1px solid black;
        border-collapse: collapse;
    }
</style>
<body>

        <colgroup>
            <col span="1" style="background-color: aqua">
            <col span="1" style="background-color: rgb(255, 0, 204)">
        </colgroup>
        <thead>
            <tr>
                <th>Month</th>
                <th>Savings</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>March</td>
                <td>2000</td>
            </tr>
            <tr>
                <td>April</td>
                <td>4300</td>
            </tr>
            <tr>
                <td>May</td>
                <td>3000</td>
            </tr>
        </tbody>
    </table>
